<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bangla Fake News Detector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1 id="app-title">Bangla Fake News Detector</h1>
    <button id="lang-switch-btn" class="lang-switch">বাংলা</button>
  </header>

  <!-- C3: Tab Navigation -->
  <div class="tabs-nav" id="main-tabs" style="display: none;">
    <button class="tab-btn active" id="tab-btn-page">Current page</button>
    <button class="tab-btn" id="tab-btn-paste">Paste text</button>
  </div>

  <main id="main-content">
    <!-- State: Consent Request -->
    <div id="consent-state" style="display: none;">
      <div class="card warning">
        <p id="consent-text"></p>
      </div>
      <button id="consent-agree-btn" class="btn-primary"></button>
      <button id="consent-decline-btn" class="btn-secondary"></button>
    </div>

    <!-- State: Idle (Page Analysis) -->
    <div id="idle-state">
      <div class="checkbox-container">
        <label>
          <input type="checkbox" id="show-preview-checkbox">
          <span id="show-preview-label">Show what will be sent</span>
        </label>
      </div>
      <button id="analyze-btn" class="btn-primary"></button>
      <button id="analyze-selection-btn" class="btn-secondary" style="margin-top: 8px;">Analyze selected text</button>
    </div>

    <!-- State: Paste Text Tab View (C3) -->
    <div id="paste-state" style="display: none;">
      <div class="form-group" style="margin-bottom: 8px;">
        <input type="text" id="paste-headline" class="paste-input" placeholder="Headline (optional)">
      </div>
      <div class="form-group" style="margin-bottom: 8px;">
        <textarea id="paste-content" class="paste-textarea" rows="5" placeholder="Paste Bangla article text here..."></textarea>
      </div>
      <div class="checkbox-container">
        <label>
          <input type="checkbox" id="show-preview-paste-checkbox">
          <span id="show-preview-paste-label">Show what will be sent</span>
        </label>
      </div>
      <button id="paste-analyze-btn" class="btn-primary">Analyze text</button>
    </div>

    <!-- State: Preview (C1) -->
    <div id="preview-state" style="display: none;">
      <h2 id="preview-heading" class="section-title">Content to be analyzed</h2>
      <div class="preview-box">
        <div class="preview-field-title" id="preview-headline-lbl">Headline:</div>
        <div id="preview-headline" class="preview-text"></div>
        <div class="preview-field-title" id="preview-body-lbl">Body content (first 400 words):</div>
        <div id="preview-body" class="preview-text"></div>
        <div class="preview-meta">
          <strong id="preview-word-count-lbl">Word count:</strong> <span id="preview-word-count">0</span>
        </div>
      </div>
      <button id="preview-send-btn" class="btn-primary" style="margin-top: 10px;">Send for analysis</button>
      <button id="preview-cancel-btn" class="btn-secondary">Cancel</button>
    </div>

    <!-- State: Loading -->
    <div id="loading-state" style="display: none;">
      <div class="spinner-container">
        <div class="spinner"></div>
        <div id="loading-text">Analyzing article...</div>
      </div>
    </div>

    <!-- State: Result Card -->
    <div id="result-state" style="display: none;">
      <div id="result-card" class="card">
        <div id="result-message"></div>
        <div id="result-score" class="score-badge" style="display: none;"></div>
      </div>
      <div id="disclaimer-text" class="disclaimer"></div>
      <button id="reanalyze-btn" class="btn-secondary" style="margin-top: 10px;">Analyze again</button>
    </div>
  </main>

  <div class="footer-links">
    <a href="#" id="open-options">Settings</a>
  </div>

  <script src="strings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
