services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: fake_news_api
    restart: unless-stopped
    environment:
      - PORT=8000
      - API_KEY=${API_KEY:-}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-30}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - MODEL_DIR=/app/backend/model
      - BANDS_FILE=/app/backend/app/bands.json
    volumes:
      # Model directory mounted as volume - NEVER baked into the image
      - ../backend/model:/app/backend/model:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 4G

  caddy:
    image: caddy:2-alpine
    container_name: fake_news_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:

